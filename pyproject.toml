[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "patchpilot-lab"
version = "0.1.0"
description = "Evidence-first patch generation, test execution, learned candidate ranking, and human review"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
  "httpx>=0.27,<1", "numpy>=1.26,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8"]
ml = ["torch>=2.4,<3", "scikit-learn>=1.5,<2"]
graph = ["langgraph>=1,<2"]
browser = ["playwright>=1.45,<2"]

[project.scripts]
patchpilot = "patchpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
patchpilot = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["docker: requires a local Docker daemon and prebuilt runner image", "graph: requires the optional LangGraph dependency"]

[tool.coverage.run]
source = ["patchpilot"]
omit = ["*/harness.py"]
